name: Foundation

on:
  push:
    branches: [master, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  foundation:
    name: Docker foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: xorgate-ci
      HTTP_PORT: '8088'
      SERVER_NAME: ':80'
      XORGATE_URL: http://127.0.0.1:8088
      # Disposable credential for this isolated runner; never a deployed secret.
      XORGATE_MCP_TOKEN: foundation-ci-disposable-token-2026
      XORDER_PHP_DEV_IMAGE: ghcr.io/xormania/php-dev@sha256:cd670b7c7b9624ce7dc7ee6b7b2a4d5b19ce36d6226f077a417667ae8505e000
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Require committed dependency inputs
        run: |
          git ls-files --error-unmatch composer.json composer.lock symfony.lock importmap.php
          test -s composer.lock
          test -s symfony.lock
          mkdir -p var/ci
          git rev-parse HEAD > var/ci/checkout-sha.txt
          git status --porcelain=v1 > var/ci/checkout-status.txt

      - name: Check Docker and the selected xorder CLI runtime
        run: |
          docker info
          docker compose version
          docker run --rm --init \
            -e PUID="$(id -u)" -e PGID="$(id -g)" \
            --mount "type=bind,src=$PWD,dst=/workspace" \
            "$XORDER_PHP_DEV_IMAGE" bash -lc '
              set -euo pipefail
              php --version
              php -r '\''foreach (["pdo_pgsql", "intl", "mbstring", "sodium"] as $extension) { if (!extension_loaded($extension)) { fwrite(STDERR, "Missing extension: ".$extension.PHP_EOL); exit(1); } }'\''
              composer --version
              composer validate --strict
            '

      - name: Verify locked production assets and boot without development tools
        run: |
          docker build --target frankenphp_prod --tag xorgate-ci-production .
          docker run --rm --entrypoint php xorgate-ci-production -r '
            require "vendor/autoload.php";
            (new Symfony\Component\Dotenv\Dotenv())->bootEnv(".env");
            $kernel = new App\Kernel("prod", false);
            $kernel->boot();
            $routes = $kernel->getContainer()->get("router")->getRouteCollection();
            if (!$routes->get("app_projects") || !$routes->get("app_project_new") || $routes->get("_profiler") || $routes->get("_wdt")
                || Composer\InstalledVersions::isInstalled("symfony/ai-mate")
                || Composer\InstalledVersions::isInstalled("symfony/web-profiler-bundle")) {
              fwrite(STDERR, "Production routes or no-dev dependencies are incorrect.\n"); exit(1);
            }
            echo "Production kernel booted with application routes and no development tools.\n";
          '

      - name: Bootstrap the development stack from committed locks
        run: bin/setup

      - name: Preserve dependency and recipe inputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: foundation-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: |
            composer.lock
            symfony.lock
            importmap.php
            assets/
            templates/components/
            templates/layouts/
            templates/form/
            config/packages/uxor.yaml

      - name: Reproduce the pinned UXor recipe installation
        run: docker compose exec -T php bash bin/check-ui-install

      - name: Validate PHP, service tests and native Mate development diagnostics
        run: bin/check

      - name: Prove the pinned Serena consumer MCP and persistent REPL session
        run: |
          bin/serena pull
          python3 tests/smoke/development.py serena

      - name: Prove project registration and execution provenance through UI, MCP and CLI
        run: python3 tests/smoke/registry.py register

      - name: Prove probe and report intake admission while the worker is stopped
        run: |
          docker compose stop worker
          # Exercise a real admission rejection with one pending probe, not 100 fixtures.
          docker compose exec -T php sh -c 'printf "%s\n" "XORGATE_PROBE_MAX_PENDING=1" "XORGATE_INTAKE_MAX_PENDING=1" >> .env.local'
          docker compose restart php
          docker compose up -d --wait --wait-timeout 120 php
          python3 tests/smoke/foundation.py queued
          python3 tests/smoke/intake.py queued

      - name: Prove native worker completion and retained original report bytes
        run: |
          docker compose up -d --wait worker
          python3 tests/smoke/foundation.py complete
          python3 tests/smoke/intake.py complete
          python3 tests/smoke/development.py worker-log

      - name: Prove ordinary container restart preserves records and artifacts
        run: |
          docker compose restart
          docker compose up -d --wait --wait-timeout 120
          python3 tests/smoke/foundation.py persist
          python3 tests/smoke/registry.py persist
          python3 tests/smoke/intake.py persist

      - name: Verify installation did not change reviewed inputs
        run: |
          git diff --exit-code HEAD -- composer.json composer.lock symfony.lock importmap.php assets templates config
          unexpected=$(git ls-files --others --exclude-standard -- assets templates config)
          if [[ -n "$unexpected" ]]; then
            printf 'Installation created unreviewed source files:\n%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Collect diagnostic output
        if: always()
        run: |
          mkdir -p var/ci
          docker compose ps -a > var/ci/compose-status.txt 2>&1 || true
          docker compose logs --no-color --timestamps > var/ci/compose.log 2>&1 || true
          mkdir -p var/ci/container
          docker compose cp php:/app/var/ci/. var/ci/container/ > var/ci/copy-evidence.log 2>&1 || true
          cat var/ci/copy-evidence.log
          find var/ci/container -type f -printf '%P\n' | sort > var/ci/container-files.txt
          cat var/ci/container-files.txt
          docker compose images --format json > var/ci/compose-images.json 2>&1 || true
          {
            docker version
            docker compose version
            docker compose exec -T php php --version
            docker compose exec -T php composer --version
            docker compose exec -T database postgres --version
            database_container=$(docker compose ps -q database)
            database_image=$(docker inspect "$database_container" --format '{{.Image}}')
            docker image inspect "$database_image" --format '{{json .RepoDigests}}'
          } > var/ci/runtime-versions.txt 2>&1 || true
          cat var/ci/runtime-versions.txt

      - name: Preserve foundation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: foundation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: var/ci/

      - name: Remove this runner's disposable stack
        if: always()
        run: docker compose down --volumes --remove-orphans
