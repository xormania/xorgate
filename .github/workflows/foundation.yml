name: Foundation

on:
  push:
    branches: [master, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Docker foundation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: xorgate-ci
      HTTP_PORT: '8088'
      SERVER_NAME: ':80'
      XORGATE_URL: http://127.0.0.1:8088
      # Disposable credential for this isolated runner; never a deployed secret.
      XORGATE_MCP_TOKEN: foundation-ci-disposable-token-2026
      XORDER_PHP_DEV_IMAGE: ghcr.io/xormania/php-dev@sha256:cd670b7c7b9624ce7dc7ee6b7b2a4d5b19ce36d6226f077a417667ae8505e000
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check Docker and the selected xorder CLI runtime
        run: |
          docker info
          docker compose version
          docker run --rm --init \
            -e PUID="$(id -u)" -e PGID="$(id -g)" \
            --mount "type=bind,src=$PWD,dst=/workspace" \
            "$XORDER_PHP_DEV_IMAGE" bash -lc '
              set -euo pipefail
              php --version
              php -r '\''foreach (["pdo_pgsql", "intl", "mbstring", "sodium"] as $extension) { if (!extension_loaded($extension)) { fwrite(STDERR, "Missing extension: ".$extension.PHP_EOL); exit(1); } }'\''
              composer --version
              composer validate --no-check-lock --strict
            '

      - name: Verify locked production assets and boot without development tools
        run: |
          docker build --target frankenphp_prod --tag xorgate-ci-production .
          docker run --rm --entrypoint php xorgate-ci-production -r '
            require "vendor/autoload.php";
            (new Symfony\Component\Dotenv\Dotenv())->bootEnv(".env");
            $kernel = new App\Kernel("prod", false);
            $kernel->boot();
            $routes = $kernel->getContainer()->get("router")->getRouteCollection();
            if (!$routes->get("app_projects") || !$routes->get("app_project_new") || $routes->get("_profiler") || $routes->get("_wdt")
                || Composer\InstalledVersions::isInstalled("symfony/ai-mate")
                || Composer\InstalledVersions::isInstalled("symfony/web-profiler-bundle")) {
              fwrite(STDERR, "Production routes or no-dev dependencies are incorrect.\n"); exit(1);
            }
            echo "Production kernel booted with application routes and no development tools.\n";
          '

      - name: Bootstrap the development stack
        run: |
          mkdir -p var/ci
          if test -f composer.lock; then
            bin/setup
          else
            # Explicit, temporary initial-scaffold resolution. CI never commits it.
            bin/setup --resolve
          fi

      - name: Preserve resolved scaffold for maintainer review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: foundation-scaffold-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            composer.lock
            symfony.lock
            importmap.php
            assets/
            templates/components/
            templates/layouts/
            templates/form/
            config/packages/uxor.yaml

      - name: Reproduce the pinned UXor recipe installation
        run: docker compose exec -T php bash bin/check-ui-install

      - name: Validate PHP, service tests and native Mate development diagnostics
        run: bin/check

      - name: Prove the pinned Serena consumer MCP and persistent REPL session
        run: |
          bin/serena pull
          python3 tests/smoke/development.py serena

      - name: Prove project registration and execution provenance through UI, MCP and CLI
        run: python3 tests/smoke/registry.py register

      - name: Prove MCP queues work while the worker is stopped
        run: |
          docker compose stop worker
          # Exercise a real admission rejection with one pending probe, not 100 fixtures.
          docker compose exec -T php sh -c 'printf "%s\n" "XORGATE_PROBE_MAX_PENDING=1" >> .env.local'
          docker compose restart php
          docker compose up -d --wait --wait-timeout 120 php
          python3 tests/smoke/foundation.py queued

      - name: Prove the worker completes the durable probe and writes its artifact
        run: |
          docker compose up -d --wait worker
          python3 tests/smoke/foundation.py complete
          python3 tests/smoke/development.py worker-log

      - name: Prove ordinary container restart preserves records and artifacts
        run: |
          docker compose restart
          docker compose up -d --wait --wait-timeout 120
          python3 tests/smoke/foundation.py persist
          python3 tests/smoke/registry.py persist

      - name: Collect diagnostic output
        if: always()
        run: |
          mkdir -p var/ci
          docker compose ps -a > var/ci/compose-status.txt
          docker compose logs --no-color --timestamps > var/ci/compose.log 2>&1

      - name: Preserve foundation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: foundation-evidence-${{ github.sha }}
          retention-days: 7
          path: var/ci/

      - name: Remove this runner's disposable stack
        if: always()
        run: docker compose down --volumes --remove-orphans
