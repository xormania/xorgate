doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        # These tables are owned by explicit operational migrations, not ORM entities.
        schema_filter: '~^(?!foundation_probe$|messenger_messages$)~'
    orm:
        auto_generate_proxy_classes: true
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: App\Entity
                alias: App

when@test:
    doctrine:
        dbal:
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'
